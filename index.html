<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIXTHREE Bio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
  color: white;
  overflow-x: hidden;
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
  position: fixed;
  width: 100%;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}

nav h1 {
  font-size: 20px;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.hero h1 {
  font-size: 60px;
  background: linear-gradient(90deg, #00ffc3, #00aaff);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  margin-top: 10px;
  color: #aaa;
}

.btn {
  margin-top: 20px;
  padding: 12px 25px;
  background: #00ffc3;
  color: black;
  border-radius: 8px;
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
}

/* SECTION */
.section {
  padding: 100px 50px;
  text-align: center;
}

.section h2 {
  font-size: 40px;
  margin-bottom: 20px;
}

/* CARDS */
.cards {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 25px;
  border-radius: 15px;
  width: 260px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px);
  background: rgba(255,255,255,0.1);
}

/* CLICKABLE CARD */
a.card {
  text-decoration: none;
  color: white;
}

a.card:hover {
  transform: scale(1.05);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<nav>
  <h1>SIXTHREE</h1>
  <div>
    <a href="#about">About</a>
    <a href="#work">Work</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<section class="hero">
  <h1>SIXTHREE</h1>
  <p>Age 18 • Creative Developer</p>
  <a href="#contact" class="btn">Contact Me</a>
</section>

<section id="about" class="section">
  <h2>About Me</h2>
  <p> SIXTHREE 18y </p>
</section>

<section id="work" class="section">
  <h2>My Work</h2>
  <div class="cards">
    <div class="card">Website Project</div>
    <div class="card">UI Design</div>
    <div class="card">Other Projects</div>
  </div>
</section>

<section id="contact" class="section">
  <h2>Contact</h2>

  <div class="cards">
    <a href="https://discord.gg/ใส่ลิ้งคุณ" target="_blank" class="card">
      <h3>Discord</h3>
      <p>Click to join</p>
    </a>
  </div>

</section>

<footer>
  © 2026 SIXTHREEดิ่วะ
</footer>

</body>
</html>
