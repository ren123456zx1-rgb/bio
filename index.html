<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIXTHREE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
  scroll-behavior: smooth; /* ⭐ ทำให้เลื่อนลื่น */
}

body {
  background: linear-gradient(270deg, #0f0f0f, #001f2f, #0f0f0f);
  background-size: 400% 400%;
  animation: bgMove 10s ease infinite;
  color: white;
}

/* BG animation */
@keyframes bgMove {
  0% { background-position: 0% }
  50% { background-position: 100% }
  100% { background-position: 0% }
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
  position: fixed;
  width: 100%;
  backdrop-filter: blur(15px);
  background: rgba(0,0,0,0.3);
}

nav a {
  color: #00ffc3;
  text-decoration: none;
  margin-left: 20px;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.hero h1 {
  font-size: 70px;
  background: linear-gradient(90deg, #00ffc3, #00aaff, #ff00ff);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  color: #ccc;
}

/* BUTTON */
.btn {
  margin-top: 20px;
  padding: 12px 25px;
  border-radius: 10px;
  background: linear-gradient(90deg, #00ffc3, #00aaff);
  color: black;
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #00ffc3;
}

/* SECTION */
.section {
  padding: 120px 20px;
  text-align: center;
}

/* CARDS */
.cards {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding: 25px;
  border-radius: 15px;
  width: 260px;
  transition: 0.3s;
  border: 1px solid rgba(255,255,255,0.1);
}

.card:hover {
  transform: translateY(-10px) scale(1.05);
  box-shadow: 0 0 20px #00ffc3;
}

/* CLICK CARD */
a.card {
  text-decoration: none;
  color: white;
}
</style>
</head>

<body>

<nav>
  <h2>SIXTHREE</h2>
  <div>
    <a href="#about">About</a>
    <a href="#work">Work</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<section class="hero">
  <h1>SIXTHREE</h1>
  <p>Age 18 • Creative Dev</p>
  <a href="#work" class="btn">See My Work</a>
</section>

<section id="about" class="section">
  <h2>About Me</h2>
  <p>สายทำเว็บ + ดีไซน์ + ทำของเท่ ๆ</p>
</section>

<section id="work" class="section">
  <h2>Projects</h2>
  <div class="cards">
    <div class="card">Website</div>
    <div class="card">Design</div>
    <div class="card">Other</div>
  </div>
</section>

<section id="contact" class="section">
  <h2>Contact</h2>

  <div class="cards">
    <a href="https://discord.gg/ใส่ลิ้งคุณ" target="_blank" class="card">
      <h3>Discord</h3>
      <p>Click to join</p>
    </a>
  </div>

</section>

</body>
</html>
