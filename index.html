<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIXTHREE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: linear-gradient(135deg, #0f0f0f, #001f2f);
  color: white;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.hero h1 {
  font-size: 70px;
  background: linear-gradient(90deg, #00ffc3, #00aaff, #ff00ff);
  -webkit-background-clip: text;
  color: transparent;
}

.btn {
  margin-top: 20px;
  padding: 14px 30px;
  border-radius: 10px;
  background: linear-gradient(90deg, #00ffc3, #00aaff);
  color: black;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #00ffc3;
}

/* POPUP */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
}

.popup-content {
  background: #111;
  padding: 40px;
  border-radius: 15px;
  text-align: center;
  width: 80%;
  max-width: 600px;
}

.cards {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-top: 20px;
}

.card {
  padding: 20px;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px #00ffc3;
}

.close {
  margin-top: 20px;
  cursor: pointer;
  color: #aaa;
}
</style>
</head>

<body>

<div class="hero">
  <h1>SIXTHREE</h1>
  <p>Age 18 • Creative Dev</p>

  <!-- ปุ่ม -->
  <button class="btn" onclick="openPopup()">My Work</button>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h2>My Projects</h2>

    <div class="cards">
      <div class="card">Website</div>
      <div class="card">Design</div>
      <div class="card">Other</div>
    </div>

    <div class="close" onclick="closePopup()">Close</div>
  </div>
</div>

<script>
function openPopup() {
  document.getElementById("popup").style.display = "flex";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
